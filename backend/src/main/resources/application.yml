server:
  port: 8080

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/yinling_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true


jwt:
  secret: yinling-demo-secret-key-for-jwt-2026-strong
  expiration-ms: 86400000


ocr:
  enabled: false
  provider: mock
  aliyun:
    endpoint: https://ocr-api.cn-hangzhou.aliyuncs.com
    access-key-id:
    access-key-secret:


storage:
  enabled: false
  endpoint: http://localhost:9000
  public-url: http://localhost:9000/yinling-files
  access-key: minioadmin
  secret-key: minioadmin
  bucket: yinling-files


llm:
  enabled: true
  provider: deepseek
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}


  qwen:
    api-key:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus


embedding:
  provider: mock
  dimension: 1536
  base-url:
  api-key:
  model: text-embedding-3-small


vector:
  provider: mock
  postgres:
    url: jdbc:postgresql://localhost:5432/yinling_vector
    username: postgres
    password: postgres
